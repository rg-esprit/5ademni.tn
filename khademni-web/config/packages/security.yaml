security:
    password_hashers:
        App\Entity\User:
            id: App\Service\LegacySha256PasswordHasher

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js|assets)/
            security: false

        main:
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                username_parameter: email
                password_parameter: password
                default_target_path: app_profile
            logout:
                path: app_logout
                target: app_login

    access_control:
        - { path: ^/login$, roles: PUBLIC_ACCESS }
        - { path: ^/signup$, roles: PUBLIC_ACCESS }
        - { path: ^/face/login$, roles: PUBLIC_ACCESS }
        - { path: ^/profile, roles: ROLE_USER }
        - { path: ^/reviews, roles: ROLE_USER }
        - { path: ^/modules, roles: ROLE_USER }
        - { path: ^/me/avatar$, roles: ROLE_USER }
        - { path: ^/face/enroll$, roles: ROLE_USER }
        - { path: ^/$, roles: PUBLIC_ACCESS }

when@test:
    security:
        password_hashers:
            App\Entity\User:
                id: App\Service\LegacySha256PasswordHasher
